name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax of every script
        run: for f in js/*.js sw.js tools/*.js; do node --check "$f"; done
      - name: Strings, data, service worker list
        run: node tools/check.js
      - name: release.py compiles
        run: python3 -m py_compile release.py
